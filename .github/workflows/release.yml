name: Release Voxtera

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing v* tag to release (required for manual runs)"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Csymbol-mangling-version=v0"
  RUST_TOOLCHAIN: nightly-2026-06-13

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows-client:
    name: build-windows-client
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          lfs: true
      - name: Install Rust nightly toolchain
        uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}-x86_64-pc-windows-msvc
      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-release-
      - name: Hydrate Git LFS assets
        shell: bash
        run: git lfs checkout
      - name: Validate release gates
        run: |
          cargo run -p veloren-client-i18n --features bin --bin i18n_check -- pt-BR
          python scripts/shader_regression_gate.py
          python scripts/friends_panel_widget_id_gate.py
      - name: Build Windows client
        run: cargo build --locked --release --bin Voxtera
      - name: Set up Python for launcher
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Build Windows launcher
        working-directory: launcher
        shell: pwsh
        run: |
          python -m pip install --requirement requirements-build.txt
          python -m unittest discover -v
          python -m PyInstaller --noconfirm --clean VoxteraLauncher.spec
          if (-not (Test-Path dist/VoxteraLauncher.exe)) { throw "Windows launcher was not produced" }
      - name: Stage Windows client
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging/windows/assets | Out-Null
          Copy-Item target/release/Voxtera.exe staging/windows/Voxtera.exe
          Copy-Item launcher/dist/VoxteraLauncher.exe staging/windows/VoxteraLauncher.exe
          Copy-Item -Recurse assets/* staging/windows/assets/
          if (-not (Test-Path staging/windows/assets/common/canary.canary)) { throw "Assets were not hydrated" }
      - name: Upload Windows client artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: voxtera-windows-client
          path: staging/windows
          if-no-files-found: error

  build-linux-server:
    name: build-linux-server
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container: rockylinux:9
    steps:
      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          dnf install -y git git-lfs gcc gcc-c++ make perl openssl-devel pkg-config curl-minimal tar gzip binutils python3 nodejs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          lfs: true
      - name: Locate checked out repository
        id: workspace
        shell: bash
        run: |
          set -euo pipefail
          repo_dir="$(find /__w /github /home/runner/work /workspace -type d -name .git -prune -print -quit 2>/dev/null | sed 's#/.git$##')"
          if [ -z "$repo_dir" ]; then
            repo_dir="$(find /__w /github /home/runner/work /workspace -type f -name .git -print -quit 2>/dev/null | sed 's#/.git$##')"
          fi
          test -n "$repo_dir" && test -d "$repo_dir/.git"
          echo "REPO_DIR=$repo_dir" >> "$GITHUB_ENV"
          echo "repo_dir=$repo_dir" >> "$GITHUB_OUTPUT"
      - name: Install Rust nightly toolchain
        uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}-x86_64-unknown-linux-gnu
      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-server-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-server-release-
      - name: Hydrate Git LFS assets
        shell: bash
        run: |
          set -euo pipefail
          test -d "$REPO_DIR/.git"
          git config --global --add safe.directory "$REPO_DIR"
          git -C "$REPO_DIR" rev-parse --show-toplevel
          git -C "$REPO_DIR" lfs ls-files
          git -C "$REPO_DIR" lfs checkout
      - name: Build Linux server
        run: |
          set -euo pipefail
          cd "$REPO_DIR"
          cargo build --locked --release --bin veloren-server-cli
      - name: Verify GLIBC 2.34 compatibility
        shell: bash
        run: |
          set -euo pipefail
          cd "$REPO_DIR"
          ldd --version | sed -n '1p'
          python3 scripts/verify_glibc_compatibility.py target/release/veloren-server-cli
      - name: Stage Linux server
        shell: bash
        run: |
          set -euo pipefail
          cd "$REPO_DIR"
          test -x target/release/veloren-server-cli
          mkdir -p staging/server/assets
          cp target/release/veloren-server-cli staging/server/
          cp -R assets/common staging/server/assets/
          cp -R assets/server staging/server/assets/
          cp -R assets/world staging/server/assets/
          cp deploy/voxtera-server.service staging/server/
      - name: Upload Linux server artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: voxtera-server-linux
          path: ${{ steps.workspace.outputs.repo_dir }}/staging/server
          if-no-files-found: error

  package-and-release:
    name: package-and-release
    needs: [build-windows-client, build-linux-server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          lfs: true
      - name: Download Windows artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: voxtera-windows-client
          path: artifacts/windows
      - name: Download Linux server artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: voxtera-server-linux
          path: artifacts/server
      - name: Package and hash release artifacts
        id: package
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" == v* ]] || { echo "release_tag must start with v"; exit 1; }
          windows_archive="Voxtera-windows-x64-${RELEASE_TAG}.zip"
          server_archive="voxtera-server-linux-x86_64-${RELEASE_TAG}.tar.gz"
          manifest="manifest-${RELEASE_TAG}.json"
          (cd artifacts/windows && zip -qry "$GITHUB_WORKSPACE/${windows_archive}" Voxtera.exe VoxteraLauncher.exe assets)
          cp artifacts/windows/VoxteraLauncher.exe .
          chmod +x artifacts/server/veloren-server-cli
          test -x artifacts/server/veloren-server-cli
          tar -czf "${server_archive}" -C artifacts/server veloren-server-cli assets voxtera-server.service
          python scripts/release_asset_gate.py "${windows_archive}"
          python scripts/release_asset_gate.py "${server_archive}"
          windows_sha256="$(sha256sum "${windows_archive}" | awk '{print $1}')"
          server_sha256="$(sha256sum "${server_archive}" | awk '{print $1}')"
          release_commit="$(git rev-parse HEAD)"
          export RELEASE_TAG WINDOWS_SHA256="$windows_sha256" SERVER_SHA256="$server_sha256" MANIFEST="$manifest" RELEASE_COMMIT="$release_commit" GLIBC_MAX_VERSION="2.34"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          manifest = {
              "schema": "voxtera-release/v1",
              "tag": os.environ["RELEASE_TAG"],
              "commit": os.environ["RELEASE_COMMIT"],
              "artifacts": {
                  "windows-x64": {
                      "archive": f"Voxtera-windows-x64-{os.environ['RELEASE_TAG']}.zip",
                      "sha256": os.environ["WINDOWS_SHA256"],
                  },
                  "linux-x86_64": {
                      "archive": f"voxtera-server-linux-x86_64-{os.environ['RELEASE_TAG']}.tar.gz",
                      "sha256": os.environ["SERVER_SHA256"],
                      "glibc_max": os.environ["GLIBC_MAX_VERSION"],
                  },
              },
          }
          Path(os.environ["MANIFEST"]).write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY
          {
            echo "windows_archive=${windows_archive}"
            echo "server_archive=${server_archive}"
            echo "launcher_asset=VoxteraLauncher.exe"
            echo "manifest=${manifest}"
          } >> "$GITHUB_OUTPUT"
      - name: Create immutable GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          name: Voxtera ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          prerelease: false
          draft: false
          files: |
            ${{ steps.package.outputs.windows_archive }}
            ${{ steps.package.outputs.server_archive }}
            ${{ steps.package.outputs.launcher_asset }}
            ${{ steps.package.outputs.manifest }}
