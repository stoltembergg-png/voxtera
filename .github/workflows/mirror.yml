name: Mirror GitLab repository

on:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: read

jobs:
  mirror-gitlab-repo:
    uses: veloren/.github/.github/workflows/mirror.yml@6a429a591cfd9aeb665d72d7b9d0dbc46e8b931e # main
    with:
      repository-url: https://gitlab.com/veloren/veloren.git
      rewrite-lfs: true
    secrets:
      token: ${{ secrets.MIRROR_TOKEN_GITHUB }}
