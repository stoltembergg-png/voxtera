name: Generate transitive dependency lockfile

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          toolchain: nightly-2026-06-13
      - name: Resolve patched dependency graph
        run: cargo generate-lockfile
      - name: Verify transitive dependency contract
        working-directory: scripts
        run: python -m unittest test_transitive_dependency_security -v
      - name: Upload generated lockfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: generated-transitive-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
