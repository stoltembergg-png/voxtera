name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Csymbol-mangling-version=v0"
  PNPM_VERSION: "10.34.5"

jobs:
  rust-format:
    name: rust-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-06-13
          components: rustfmt
      - name: Check changed Rust formatting
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          elif [ -n "${BASE_SHA:-}" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA" || true
          fi
          if [ -n "${BASE_SHA:-}" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --diff-filter=ACMR --name-only "$BASE_SHA" "$GITHUB_SHA" -- '*.rs' > rust_files.txt
          else
            echo "Base commit unavailable; checking all tracked Rust files fail-closed."
            git ls-files '*.rs' > rust_files.txt
          fi
          if [ ! -s rust_files.txt ]; then
            echo "No changed Rust files; formatting is not applicable."
            exit 0
          fi
          xargs -r rustfmt --edition 2024 --check < rust_files.txt

  rust-server-test:
    name: rust-server-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-06-13
      - name: Test server library
        run: cargo test -p veloren-server --lib --no-default-features --features simd -- --test-threads=2

  launcher-tests:
    name: launcher-tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install launcher dependencies
        working-directory: launcher
        run: python -m pip install --requirement requirements.txt --requirement requirements-build.txt
      - name: Run launcher tests
        working-directory: launcher
        run: python -m unittest discover -v

  site-tests:
    name: site-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - name: Install site dependencies
        working-directory: site
        run: pnpm install --frozen-lockfile
      - name: Test site
        working-directory: site
        run: pnpm test -- --run
      - name: Build site
        working-directory: site
        run: pnpm build

  release-contract:
    name: release-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate release asset gate
        working-directory: scripts
        run: python -m unittest test_release_asset_gate -v
      - name: Validate release workflow contract
        working-directory: scripts
        run: python -m unittest test_release_workflow -v
      - name: Validate GLIBC compatibility gate
        working-directory: scripts
        run: python -m unittest test_verify_glibc_compatibility -v
      - name: Validate quality gate evaluator
        working-directory: scripts
        run: python -m unittest test_quality_gate -v

  quality-gate:
    name: CI / Quality Gate
    if: ${{ always() }}
    needs:
      - rust-format
      - rust-server-test
      - launcher-tests
      - site-tests
      - release-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Evaluate required producer results
        env:
          RUST_FORMAT_RESULT: ${{ needs.rust-format.result }}
          RUST_SERVER_TEST_RESULT: ${{ needs.rust-server-test.result }}
          LAUNCHER_TESTS_RESULT: ${{ needs.launcher-tests.result }}
          SITE_TESTS_RESULT: ${{ needs.site-tests.result }}
          RELEASE_CONTRACT_RESULT: ${{ needs.release-contract.result }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          names = {
              "rust-format": os.environ["RUST_FORMAT_RESULT"],
              "rust-server-test": os.environ["RUST_SERVER_TEST_RESULT"],
              "launcher-tests": os.environ["LAUNCHER_TESTS_RESULT"],
              "site-tests": os.environ["SITE_TESTS_RESULT"],
              "release-contract": os.environ["RELEASE_CONTRACT_RESULT"],
          }
          payload = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "sha": os.environ["GITHUB_SHA"],
              "producers": [
                  {"name": name, "status": "completed", "conclusion": result}
                  for name, result in names.items()
              ],
          }
          Path("quality-gate-results.json").write_text(json.dumps(payload), encoding="utf-8")
          PY
          python scripts/quality_gate.py quality-gate-results.json
